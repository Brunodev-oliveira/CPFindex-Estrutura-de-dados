<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="320" fill="#f8f9fa"/>
  <text x="380" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Classe Contribuinte — dados armazenados em cada nó</text>

  <!-- Contribuinte box -->
  <rect x="260" y="58" width="240" height="180" rx="12" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="260" y="58" width="240" height="44" rx="12" fill="#1351B4"/>
  <rect x="260" y="86" width="240" height="16" fill="#1351B4"/>
  <text x="380" y="87" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Contribuinte</text>

  <line x1="260" y1="118" x2="500" y2="118" stroke="#e0e0e0" stroke-width="1"/>
  <text x="276" y="138" fill="#888" font-size="12">String</text>
  <text x="316" y="138" fill="#333" font-size="13" font-weight="bold">cpf</text>
  <text x="276" y="158" fill="#888" font-size="12">String</text>
  <text x="316" y="158" fill="#333" font-size="13">nome</text>
  <text x="276" y="178" fill="#888" font-size="12">String</text>
  <text x="316" y="178" fill="#333" font-size="13">situation</text>

  <line x1="260" y1="190" x2="500" y2="190" stroke="#e0e0e0" stroke-width="1"/>
  <text x="276" y="212" fill="#1351B4" font-size="12">getCpfFormatted()</text>
  <text x="276" y="228" fill="#888" font-size="11">→ ###.###.###-##</text>

  <!-- CPF normalization note -->
  <rect x="30" y="100" width="200" height="60" rx="8" fill="#fff8e1" stroke="#F5A800" stroke-width="1.5"/>
  <text x="130" y="120" text-anchor="middle" fill="#c47f00" font-size="12" font-weight="bold">construtor sanitiza CPF</text>
  <text x="130" y="138" text-anchor="middle" fill="#888" font-size="11">replaceAll("[^0-9]","")</text>
  <text x="130" y="152" text-anchor="middle" fill="#888" font-size="11">apenas dígitos armazenados</text>
  <line x1="230" y1="130" x2="260" y2="138" stroke="#F5A800" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- getCpfFormatted note -->
  <rect x="530" y="180" width="200" height="60" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="630" y="200" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">apenas para exibição</text>
  <text x="630" y="218" text-anchor="middle" fill="#888" font-size="11">internamente: só dígitos</text>
  <text x="630" y="234" text-anchor="middle" fill="#888" font-size="11">compareTo() funciona ✓</text>
  <line x1="530" y1="210" x2="500" y2="218" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- example -->
  <rect x="200" y="268" width="360" height="36" rx="8" fill="#e8f0fe"/>
  <text x="380" y="282" text-anchor="middle" fill="#1351B4" font-size="12">entrada: "728.239.367-26"</text>
  <text x="380" y="298" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">armazenado: "72823936726"  |  exibido: "728.239.367-26"</text>
</svg>

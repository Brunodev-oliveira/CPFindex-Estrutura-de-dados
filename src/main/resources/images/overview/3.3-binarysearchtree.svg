<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="380" fill="#f8f9fa"/>
  <text x="380" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Classe BinarySearchTree — atributos e métodos</text>

  <!-- BST box -->
  <rect x="220" y="55" width="320" height="280" rx="12" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="220" y="55" width="320" height="44" rx="12" fill="#1351B4"/>
  <rect x="220" y="83" width="320" height="16" fill="#1351B4"/>
  <text x="380" y="84" text-anchor="middle" fill="white" font-size="15" font-weight="bold">BinarySearchTree</text>

  <!-- attributes -->
  <line x1="220" y1="115" x2="540" y2="115" stroke="#e0e0e0" stroke-width="1"/>
  <text x="236" y="134" fill="#F5A800" font-size="12" font-weight="bold">NodeBst</text>
  <text x="292" y="134" fill="#333" font-size="13">root</text>
  <text x="236" y="152" fill="#F5A800" font-size="12" font-weight="bold">int</text>
  <text x="262" y="152" fill="#333" font-size="13">amount</text>
  <text x="236" y="170" fill="#F5A800" font-size="12" font-weight="bold">int</text>
  <text x="262" y="170" fill="#333" font-size="13">searchCount</text>

  <!-- methods -->
  <line x1="220" y1="182" x2="540" y2="182" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="236" y="200" fill="#1351B4" font-size="12">insert(Contribuinte) → boolean</text>
  <text x="236" y="218" fill="#1351B4" font-size="12">search(String cpf) → Contribuinte</text>
  <text x="236" y="236" fill="#1351B4" font-size="12">searchPath(String) → List&lt;NodeBst&gt;</text>
  <text x="236" y="254" fill="#1351B4" font-size="12">delete(String cpf) → boolean</text>
  <text x="236" y="272" fill="#1351B4" font-size="12">inOrder() → List&lt;Contribuinte&gt;</text>
  <text x="236" y="290" fill="#1351B4" font-size="12">bstHeight() → int</text>
  <text x="236" y="308" fill="#1351B4" font-size="12">balanceFactor() → int</text>

  <!-- annotations right -->
  <rect x="570" y="115" width="170" height="38" rx="6" fill="#fff8e1" stroke="#F5A800" stroke-width="1.5"/>
  <text x="655" y="131" text-anchor="middle" fill="#c47f00" font-size="11" font-weight="bold">único ponto de entrada</text>
  <text x="655" y="146" text-anchor="middle" fill="#c47f00" font-size="11">para toda a árvore</text>
  <line x1="540" y1="130" x2="570" y2="130" stroke="#F5A800" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="570" y="222" width="170" height="38" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="655" y="238" text-anchor="middle" fill="#1351B4" font-size="11" font-weight="bold">base das animações</text>
  <text x="655" y="253" text-anchor="middle" fill="#1351B4" font-size="11">na aba Demonstração</text>
  <line x1="540" y1="236" x2="570" y2="236" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="570" y="288" width="170" height="38" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="655" y="304" text-anchor="middle" fill="#1351B4" font-size="11" font-weight="bold">métricas ao vivo</text>
  <text x="655" y="319" text-anchor="middle" fill="#1351B4" font-size="11">exibidas na interface</text>
  <line x1="540" y1="298" x2="570" y2="298" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- annotation left -->
  <rect x="20" y="185" width="170" height="56" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="105" y="205" text-anchor="middle" fill="#1351B4" font-size="11" font-weight="bold">todos os métodos</text>
  <text x="105" y="221" text-anchor="middle" fill="#1351B4" font-size="11">delegam para funções</text>
  <text x="105" y="237" text-anchor="middle" fill="#1351B4" font-size="11">recursivas internas</text>
  <line x1="190" y1="213" x2="220" y2="218" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>
</svg>

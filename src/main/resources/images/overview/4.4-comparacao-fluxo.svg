<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="360" fill="#f8f9fa"/>
  <text x="430" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Aba Comparação — fluxo paralelo</text>

  <!-- Load phase -->
  <rect x="290" y="56" width="280" height="50" rx="10" fill="#1351B4"/>
  <text x="430" y="78" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Task&lt;Void&gt; — thread separada</text>
  <text x="430" y="96" text-anchor="middle" fill="white" font-size="11">carrega 1.000.000 registros sem travar a UI</text>

  <!-- split arrow -->
  <line x1="360" y1="106" x2="210" y2="140" stroke="#1351B4" stroke-width="2"/>
  <line x1="500" y1="106" x2="650" y2="140" stroke="#1351B4" stroke-width="2"/>
  <polygon points="210,140 198,127 222,127" fill="#1351B4"/>
  <polygon points="650,140 638,127 662,127" fill="#1351B4"/>

  <!-- BST side -->
  <rect x="60" y="140" width="300" height="50" rx="8" fill="#1351B4"/>
  <text x="210" y="162" text-anchor="middle" fill="white" font-size="13" font-weight="bold">BinarySearchTree</text>
  <text x="210" y="180" text-anchor="middle" fill="white" font-size="11">tree.insert() × 1.000.000</text>

  <!-- LinkedList side -->
  <rect x="500" y="140" width="300" height="50" rx="8" fill="#1351B4" opacity="0.7"/>
  <text x="650" y="162" text-anchor="middle" fill="white" font-size="13" font-weight="bold">LinkedList</text>
  <text x="650" y="180" text-anchor="middle" fill="white" font-size="11">list.insert() × 1.000.000</text>

  <!-- search trigger -->
  <rect x="310" y="215" width="240" height="36" rx="8" fill="#F5A800"/>
  <text x="430" y="237" text-anchor="middle" fill="white" font-size="13" font-weight="bold">buscar CPF → Comparar</text>

  <line x1="380" y1="215" x2="250" y2="200" stroke="#F5A800" stroke-width="2"/>
  <line x1="480" y1="215" x2="610" y2="200" stroke="#F5A800" stroke-width="2"/>
  <polygon points="250,200 240,213 254,215" fill="#F5A800"/>
  <polygon points="610,200 606,213 620,215" fill="#F5A800"/>

  <!-- results BST -->
  <rect x="60" y="268" width="300" height="68" rx="8" fill="white" stroke="#1351B4" stroke-width="2"/>
  <text x="210" y="288" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">BST</text>
  <text x="210" y="308" text-anchor="middle" fill="#555" font-size="12">Comparações: <tspan fill="#1351B4" font-weight="bold">28</tspan></text>
  <text x="210" y="326" text-anchor="middle" fill="#555" font-size="12">Tempo: <tspan fill="#1351B4" font-weight="bold">10,29 μs</tspan></text>

  <!-- results LinkedList -->
  <rect x="500" y="268" width="300" height="68" rx="8" fill="white" stroke="#e63946" stroke-width="2"/>
  <text x="650" y="288" text-anchor="middle" fill="#e63946" font-size="12" font-weight="bold">Lista Ligada</text>
  <text x="650" y="308" text-anchor="middle" fill="#555" font-size="12">Comparações: <tspan fill="#e63946" font-weight="bold">1.000.000</tspan></text>
  <text x="650" y="326" text-anchor="middle" fill="#555" font-size="12">Tempo: <tspan fill="#e63946" font-weight="bold">8,22 ms</tspan></text>

  <!-- verdict -->
  <rect x="180" y="348" width="500" height="6" rx="3" fill="#1351B4"/>
  <text x="430" y="344" text-anchor="middle" fill="#1351B4" font-size="13" font-weight="bold">BST fez 35.714x menos comparações que a Lista Ligada</text>

  <!-- System.nanoTime annotation -->
  <text x="430" y="208" text-anchor="middle" fill="#888" font-size="10">System.nanoTime() antes e depois de cada chamada</text>
</svg>

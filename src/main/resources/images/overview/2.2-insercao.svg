<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="780" height="520" fill="#f8f9fa"/>
  <text x="390" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Inserção — percurso até a posição correta</text>

  <!-- New CPF badge -->
  <rect x="280" y="50" width="220" height="34" rx="8" fill="#F5A800"/>
  <text x="390" y="72" text-anchor="middle" fill="white" font-size="13" font-weight="bold">inserindo: 500.000.000-00</text>

  <!-- ── NÍVEL 0: raiz ── -->
  <rect x="295" y="104" width="170" height="36" rx="8" fill="#1351B4"/>
  <text x="380" y="126" text-anchor="middle" fill="white" font-size="13" font-weight="bold">448.009.649-38</text>
  <text x="380" y="97" text-anchor="middle" fill="#888" font-size="11">raiz</text>

  <!-- bubble raiz -->
  <rect x="490" y="106" width="200" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.2"/>
  <text x="590" y="124" text-anchor="middle" fill="#1351B4" font-size="11">500… &gt; 448… → direita ▶</text>
  <line x1="465" y1="120" x2="490" y2="120" stroke="#1351B4" stroke-width="1" stroke-dasharray="3"/>

  <!-- ── NÍVEL 1: direita ── -->
  <rect x="510" y="194" width="170" height="36" rx="8" fill="#1351B4" opacity="0.82"/>
  <text x="595" y="216" text-anchor="middle" fill="white" font-size="13">782.758.194-31</text>

  <!-- bubble nível 1 -->
  <rect x="60" y="244" width="210" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.2"/>
  <text x="165" y="262" text-anchor="middle" fill="#1351B4" font-size="11">◀ 500… &lt; 782… → esquerda</text>
  <line x1="270" y1="258" x2="510" y2="218" stroke="#1351B4" stroke-width="1" stroke-dasharray="3"/>

  <!-- ── NÍVEL 2: esquerda do nível 1 ── -->
  <rect x="390" y="284" width="170" height="36" rx="8" fill="#1351B4" opacity="0.68"/>
  <text x="475" y="306" text-anchor="middle" fill="white" font-size="13">458.678.546-20</text>

  <!-- bubble nível 2 -->
  <rect x="60" y="286" width="210" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.2"/>
  <text x="165" y="304" text-anchor="middle" fill="#1351B4" font-size="11">500… &gt; 458… → direita ▶</text>
  <line x1="270" y1="300" x2="390" y2="300" stroke="#1351B4" stroke-width="1" stroke-dasharray="3"/>

  <!-- ── NÍVEL 3: direita do nível 2 ── -->
  <rect x="510" y="374" width="170" height="36" rx="8" fill="#1351B4" opacity="0.55"/>
  <text x="595" y="396" text-anchor="middle" fill="white" font-size="13">518.433.291-07</text>

  <!-- bubble nível 3 -->
  <rect x="60" y="376" width="210" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.2"/>
  <text x="165" y="394" text-anchor="middle" fill="#1351B4" font-size="11">◀ 500… &lt; 518… → esquerda</text>
  <line x1="270" y1="390" x2="510" y2="390" stroke="#1351B4" stroke-width="1" stroke-dasharray="3"/>

  <!-- ── NÍVEL 4: novo nó inserido ── -->
  <text x="395" y="452" text-anchor="middle" fill="#c47f00" font-size="11" font-weight="bold">null → inserido aqui ✓</text>
  <rect x="305" y="462" width="180" height="36" rx="8" fill="#F5A800" stroke="#c47f00" stroke-width="2"/>
  <text x="395" y="484" text-anchor="middle" fill="white" font-size="13" font-weight="bold">500.000.000-00</text>

  <!-- ── LINHAS DO CAMINHO (amarelo) ── -->
  <line x1="380" y1="84" x2="380" y2="104" stroke="#F5A800" stroke-width="2" stroke-dasharray="4"/>
  <!-- raiz → nível 1 direita -->
  <line x1="450" y1="140" x2="560" y2="194" stroke="#F5A800" stroke-width="2.5"/>
  <!-- nível 1 → nível 2 esquerda -->
  <line x1="545" y1="230" x2="510" y2="284" stroke="#F5A800" stroke-width="2.5"/>
  <!-- nível 2 → nível 3 direita -->
  <line x1="520" y1="320" x2="560" y2="374" stroke="#F5A800" stroke-width="2.5"/>
  <!-- nível 3 → novo nó esquerda -->
  <line x1="535" y1="410" x2="450" y2="462" stroke="#F5A800" stroke-width="2.5"/>

  <!-- ── RAMO ESQUERDO CINZA (não percorrido) ── -->
  <line x1="330" y1="140" x2="230" y2="194" stroke="#ccc" stroke-width="1.5"/>
  <rect x="145" y="194" width="170" height="36" rx="8" fill="#e8f0fe" stroke="#ccc" stroke-width="1.5"/>
  <text x="230" y="216" text-anchor="middle" fill="#bbb" font-size="12">379.420.305-47</text>
</svg>

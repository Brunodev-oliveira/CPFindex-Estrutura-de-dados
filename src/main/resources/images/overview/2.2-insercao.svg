<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="460" fill="#f8f9fa"/>
  <text x="350" y="36" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Inserção — percurso até a posição correta</text>

  <!-- New CPF badge -->
  <rect x="260" y="52" width="180" height="34" rx="8" fill="#F5A800"/>
  <text x="350" y="74" text-anchor="middle" fill="white" font-size="13" font-weight="bold">inserindo: 500.000.000-00</text>

  <!-- root -->
  <rect x="270" y="104" width="160" height="36" rx="8" fill="#1351B4"/>
  <text x="350" y="126" text-anchor="middle" fill="white" font-size="13">448.009.649-38</text>
  <text x="350" y="96" text-anchor="middle" fill="#555" font-size="11">raiz</text>

  <!-- comparison bubble root -->
  <rect x="430" y="107" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1"/>
  <text x="520" y="125" text-anchor="middle" fill="#1351B4" font-size="11">500… &gt; 448… → direita ▶</text>

  <!-- level 2 right -->
  <rect x="480" y="184" width="160" height="36" rx="8" fill="#1351B4" opacity="0.8"/>
  <text x="560" y="206" text-anchor="middle" fill="white" font-size="13">782.758.194-31</text>

  <!-- comparison bubble l2 -->
  <rect x="30" y="187" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1"/>
  <text x="120" y="205" text-anchor="middle" fill="#1351B4" font-size="11">◀ esquerda ← 500… &lt; 782…</text>

  <!-- level 3 left of right -->
  <rect x="370" y="264" width="160" height="36" rx="8" fill="#1351B4" opacity="0.7"/>
  <text x="450" y="286" text-anchor="middle" fill="white" font-size="13">458.678.546-20</text>

  <!-- comparison bubble l3 -->
  <rect x="30" y="267" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1"/>
  <text x="120" y="285" text-anchor="middle" fill="#1351B4" font-size="11">500… &gt; 458… → direita ▶</text>

  <!-- level 4 right of l3 -->
  <rect x="480" y="344" width="160" height="36" rx="8" fill="#1351B4" opacity="0.6"/>
  <text x="560" y="366" text-anchor="middle" fill="white" font-size="13">518.433.291-07</text>

  <!-- comparison bubble l4 -->
  <rect x="260" y="347" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1"/>
  <text x="350" y="365" text-anchor="middle" fill="#1351B4" font-size="11">500… &lt; 518… → esquerda ◀</text>

  <!-- new node inserted -->
  <rect x="370" y="420" width="160" height="36" rx="8" fill="#F5A800" stroke="#c47f00" stroke-width="2"/>
  <text x="450" y="442" text-anchor="middle" fill="white" font-size="13" font-weight="bold">500.000.000-00 ✓</text>
  <text x="450" y="416" text-anchor="middle" fill="#F5A800" font-size="11" font-weight="bold">null encontrado → inserido aqui</text>

  <!-- LINES path highlighted -->
  <line x1="350" y1="86" x2="350" y2="104" stroke="#F5A800" stroke-width="2" stroke-dasharray="4"/>
  <line x1="430" y1="122" x2="560" y2="184" stroke="#F5A800" stroke-width="2.5"/>
  <line x1="480" y1="202" x2="450" y2="264" stroke="#F5A800" stroke-width="2.5"/>
  <line x1="530" y1="282" x2="560" y2="344" stroke="#F5A800" stroke-width="2.5"/>
  <line x1="480" y1="362" x2="450" y2="420" stroke="#F5A800" stroke-width="2.5"/>

  <!-- left branch (gray, not path) -->
  <line x1="350" y1="140" x2="220" y2="184" stroke="#ccc" stroke-width="1.5"/>
  <rect x="140" y="184" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#ccc" stroke-width="1.5"/>
  <text x="220" y="206" text-anchor="middle" fill="#aaa" font-size="13">379.420.305-47</text>
</svg>

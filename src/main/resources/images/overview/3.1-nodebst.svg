<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="360" fill="#f8f9fa"/>
  <text x="380" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Classe NodeBst — estrutura de cada nó</text>

  <!-- NodeBst box center -->
  <rect x="270" y="58" width="220" height="180" rx="12" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="270" y="58" width="220" height="44" rx="12" fill="#1351B4"/>
  <rect x="270" y="86" width="220" height="16" fill="#1351B4"/>
  <text x="380" y="87" text-anchor="middle" fill="white" font-size="15" font-weight="bold">NodeBst</text>

  <line x1="270" y1="118" x2="490" y2="118" stroke="#e0e0e0" stroke-width="1"/>
  <text x="286" y="138" fill="#F5A800" font-size="13" font-weight="bold">String</text>
  <text x="340" y="138" fill="#333" font-size="13">key</text>
  <text x="286" y="160" fill="#888" font-size="12">Contribuinte</text>
  <text x="366" y="160" fill="#333" font-size="12">contribuinte</text>
  <line x1="270" y1="172" x2="490" y2="172" stroke="#e0e0e0" stroke-width="1"/>
  <text x="286" y="192" fill="#1351B4" font-size="13">NodeBst</text>
  <text x="348" y="192" fill="#333" font-size="13" font-weight="bold">left</text>
  <text x="286" y="214" fill="#1351B4" font-size="13">NodeBst</text>
  <text x="348" y="214" fill="#333" font-size="13" font-weight="bold">right</text>

  <!-- key annotation -->
  <rect x="30" y="120" width="180" height="44" rx="8" fill="#fff8e1" stroke="#F5A800" stroke-width="1.5"/>
  <text x="120" y="140" text-anchor="middle" fill="#c47f00" font-size="12" font-weight="bold">CPF sem formatação</text>
  <text x="120" y="156" text-anchor="middle" fill="#c47f00" font-size="11">critério de ordenação</text>
  <line x1="210" y1="142" x2="270" y2="138" stroke="#F5A800" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- contribuinte annotation -->
  <rect x="30" y="170" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="120" y="190" text-anchor="middle" fill="#1351B4" font-size="12">dados do contribuinte</text>
  <text x="120" y="206" text-anchor="middle" fill="#1351B4" font-size="11">cpf, nome, situation</text>
  <line x1="210" y1="192" x2="270" y2="165" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- left child node -->
  <rect x="100" y="290" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="160" y="308" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">filho esquerdo</text>
  <text x="160" y="324" text-anchor="middle" fill="#888" font-size="11">key &lt; pai</text>
  <line x1="300" y1="238" x2="190" y2="290" stroke="#1351B4" stroke-width="2"/>
  <polygon points="190,290 183,277 197,277" fill="#1351B4"/>
  <text x="230" y="272" fill="#1351B4" font-size="11">left</text>

  <!-- right child node -->
  <rect x="540" y="290" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="600" y="308" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">filho direito</text>
  <text x="600" y="324" text-anchor="middle" fill="#888" font-size="11">key &gt; pai</text>
  <line x1="460" y1="238" x2="570" y2="290" stroke="#1351B4" stroke-width="2"/>
  <polygon points="570,290 563,277 577,277" fill="#1351B4"/>
  <text x="498" y="272" fill="#1351B4" font-size="11">right</text>

  <!-- null annotation -->
  <text x="380" y="316" text-anchor="middle" fill="#888" font-size="12">ambos iniciam como null — sem referência ao pai</text>
</svg>

<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="300" fill="#f8f9fa"/>

  <!-- CPF card -->
  <rect x="40" y="80" width="220" height="140" rx="14" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="40" y="80" width="220" height="44" rx="14" fill="#1351B4"/>
  <rect x="40" y="108" width="220" height="16" fill="#1351B4"/>
  <text x="150" y="109" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Contribuinte</text>
  <text x="70" y="148" fill="#555" font-size="12">CPF:</text>
  <text x="115" y="148" fill="#1351B4" font-size="13" font-weight="bold">728.239.367-26</text>
  <text x="70" y="172" fill="#555" font-size="12">Nome:</text>
  <text x="120" y="172" fill="#333" font-size="12">Gustavo T. Sousa</text>
  <text x="70" y="196" fill="#555" font-size="12">Situação:</text>
  <text x="128" y="196" fill="#333" font-size="12">inativo</text>

  <!-- Arrow -->
  <line x1="270" y1="150" x2="360" y2="150" stroke="#1351B4" stroke-width="3"/>
  <polygon points="360,150 347,143 347,157" fill="#1351B4"/>
  <text x="310" y="140" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">chave</text>
  <text x="310" y="168" text-anchor="middle" fill="#F5A800" font-size="11">CPF → String</text>

  <!-- NodeBst box -->
  <rect x="370" y="60" width="220" height="180" rx="14" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="370" y="60" width="220" height="44" rx="14" fill="#1351B4"/>
  <rect x="370" y="88" width="220" height="16" fill="#1351B4"/>
  <text x="480" y="89" text-anchor="middle" fill="white" font-size="15" font-weight="bold">NodeBst</text>
  <text x="390" y="124" fill="#F5A800" font-size="12" font-weight="bold">key:</text>
  <text x="420" y="124" fill="#1351B4" font-size="12" font-weight="bold">72823936726</text>
  <text x="390" y="148" fill="#555" font-size="12">contribuinte: →</text>
  <text x="390" y="172" fill="#555" font-size="12">left:</text>
  <text x="425" y="172" fill="#888" font-size="12">NodeBst</text>
  <text x="390" y="196" fill="#555" font-size="12">right:</text>
  <text x="430" y="196" fill="#888" font-size="12">NodeBst</text>
  <!-- left/right arrows hint -->
  <text x="470" y="220" fill="#1351B4" font-size="11">↙ menor    maior ↘</text>

  <!-- Arrow to tree -->
  <line x1="598" y1="150" x2="680" y2="150" stroke="#1351B4" stroke-width="3"/>
  <polygon points="680,150 667,143 667,157" fill="#1351B4"/>

  <!-- Mini tree -->
  <rect x="680" y="106" width="90" height="28" rx="5" fill="#1351B4"/>
  <text x="725" y="124" text-anchor="middle" fill="white" font-size="11">raiz</text>
  <line x1="700" y1="134" x2="682" y2="162" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="750" y1="134" x2="768" y2="162" stroke="#1351B4" stroke-width="1.5"/>
  <rect x="660" y="162" width="46" height="24" rx="4" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="683" y="178" text-anchor="middle" fill="#1351B4" font-size="10">menor</text>
  <rect x="748" y="162" width="46" height="24" rx="4" fill="#F5A800" stroke="#c47f00" stroke-width="1.5"/>
  <text x="771" y="178" text-anchor="middle" fill="white" font-size="10">maior</text>
  <line x1="725" y1="186" x2="725" y2="210" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="690" y="210" width="70" height="24" rx="4" fill="#1351B4"/>
  <text x="725" y="226" text-anchor="middle" fill="#F5A800" font-size="10" font-weight="bold">novo nó</text>

  <!-- bottom label -->
  <text x="410" y="270" text-anchor="middle" fill="#1351B4" font-size="13" font-weight="bold">CPF é a chave de ordenação — cada inserção encontra sua posição na árvore</text>
</svg>

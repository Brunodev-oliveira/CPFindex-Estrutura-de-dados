<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="400" fill="#f8f9fa"/>
  <text x="430" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">delete() — Caso 3: dois filhos (sucessor em-ordem)</text>

  <!-- Step 1: find node to delete -->
  <rect x="30" y="60" width="160" height="56" rx="10" fill="#e63946"/>
  <text x="110" y="84" text-anchor="middle" fill="white" font-size="13" font-weight="bold">nó a remover</text>
  <text x="110" y="102" text-anchor="middle" fill="white" font-size="11">dois filhos</text>

  <line x1="110" y1="116" x2="110" y2="144" stroke="#1351B4" stroke-width="2"/>
  <polygon points="110,148 103,135 117,135" fill="#1351B4"/>

  <!-- Step 2: go right -->
  <rect x="30" y="148" width="160" height="46" rx="8" fill="#1351B4"/>
  <text x="110" y="168" text-anchor="middle" fill="white" font-size="12">vai para subárvore</text>
  <text x="110" y="184" text-anchor="middle" fill="white" font-size="12" font-weight="bold">direita</text>

  <line x1="110" y1="194" x2="110" y2="218" stroke="#1351B4" stroke-width="2"/>
  <polygon points="110,222 103,209 117,209" fill="#1351B4"/>

  <!-- Step 3: searchMinor -->
  <rect x="30" y="222" width="160" height="46" rx="8" fill="#1351B4"/>
  <text x="110" y="242" text-anchor="middle" fill="white" font-size="12">searchMinor()</text>
  <text x="110" y="258" text-anchor="middle" fill="white" font-size="11">desce sempre à esq.</text>

  <line x1="110" y1="268" x2="110" y2="292" stroke="#1351B4" stroke-width="2"/>
  <polygon points="110,296 103,283 117,283" fill="#1351B4"/>

  <!-- Step 4: successor found -->
  <rect x="30" y="296" width="160" height="46" rx="8" fill="#F5A800"/>
  <text x="110" y="316" text-anchor="middle" fill="white" font-size="12" font-weight="bold">sucessor em-ordem</text>
  <text x="110" y="332" text-anchor="middle" fill="white" font-size="11">menor nó da subárvore dir.</text>

  <!-- arrows right to steps 5 and 6 -->
  <line x1="190" y1="319" x2="300" y2="319" stroke="#F5A800" stroke-width="2"/>
  <polygon points="300,319 287,312 287,326" fill="#F5A800"/>

  <!-- Step 5: copy data -->
  <rect x="300" y="295" width="200" height="50" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="400" y="317" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">1. copia dados do sucessor</text>
  <text x="400" y="334" text-anchor="middle" fill="#888" font-size="11">key e contribuinte → nó removido</text>

  <line x1="400" y1="345" x2="400" y2="365" stroke="#1351B4" stroke-width="2"/>
  <polygon points="400,369 393,356 407,356" fill="#1351B4"/>

  <!-- Step 6: delete successor -->
  <rect x="300" y="369" width="200" height="22" rx="6" fill="#1351B4"/>
  <text x="400" y="384" text-anchor="middle" fill="white" font-size="11">2. deleteSuccessor() remove o sucessor</text>

  <!-- BEFORE tree -->
  <text x="600" y="72" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">ANTES</text>
  <rect x="555" y="82" width="90" height="30" rx="6" fill="#e63946"/>
  <text x="600" y="101" text-anchor="middle" fill="white" font-size="12" font-weight="bold">50 ← del</text>
  <line x1="570" y1="112" x2="535" y2="136" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="630" y1="112" x2="665" y2="136" stroke="#F5A800" stroke-width="2"/>

  <rect x="505" y="136" width="64" height="28" rx="5" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="537" y="154" text-anchor="middle" fill="#1351B4" font-size="12">30</text>

  <rect x="635" y="136" width="64" height="28" rx="5" fill="#F5A800" stroke="#c47f00" stroke-width="2"/>
  <text x="667" y="154" text-anchor="middle" fill="white" font-size="12" font-weight="bold">80</text>
  <line x1="650" y1="164" x2="625" y2="188" stroke="#F5A800" stroke-width="2"/>

  <rect x="595" y="188" width="64" height="28" rx="5" fill="#F5A800" stroke="#c47f00" stroke-width="2"/>
  <text x="627" y="206" text-anchor="middle" fill="white" font-size="12" font-weight="bold">60 ★</text>

  <text x="627" y="230" text-anchor="middle" fill="#F5A800" font-size="10" font-weight="bold">sucessor</text>

  <!-- arrow between trees -->
  <line x1="700" y1="180" x2="740" y2="180" stroke="#1351B4" stroke-width="2.5"/>
  <polygon points="740,180 727,173 727,187" fill="#1351B4"/>

  <!-- AFTER tree -->
  <text x="800" y="72" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">DEPOIS</text>
  <rect x="755" y="82" width="90" height="30" rx="6" fill="#1351B4"/>
  <text x="800" y="101" text-anchor="middle" fill="white" font-size="12" font-weight="bold">60 ✓</text>
  <line x1="770" y1="112" x2="735" y2="136" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="830" y1="112" x2="855" y2="136" stroke="#1351B4" stroke-width="1.5"/>

  <rect x="705" y="136" width="64" height="28" rx="5" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="737" y="154" text-anchor="middle" fill="#1351B4" font-size="12">30</text>

  <rect x="825" y="136" width="64" height="28" rx="5" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
  <text x="857" y="154" text-anchor="middle" fill="#1351B4" font-size="12">80</text>

  <text x="800" y="186" text-anchor="middle" fill="#1351B4" font-size="10">ordem preservada ✓</text>
</svg>

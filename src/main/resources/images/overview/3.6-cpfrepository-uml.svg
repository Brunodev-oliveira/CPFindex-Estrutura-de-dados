<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="340" fill="#f8f9fa"/>
  <text x="380" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Interface CpfRepository — contrato comum</text>

  <!-- Interface box -->
  <rect x="255" y="58" width="250" height="110" rx="12" fill="white" stroke="#1351B4" stroke-width="2.5"/>
  <rect x="255" y="58" width="250" height="44" rx="12" fill="#1351B4"/>
  <rect x="255" y="86" width="250" height="16" fill="#1351B4"/>
  <text x="380" y="78" text-anchor="middle" fill="#e8f0fe" font-size="11">«interface»</text>
  <text x="380" y="95" text-anchor="middle" fill="white" font-size="15" font-weight="bold">CpfRepository</text>
  <text x="271" y="124" fill="#1351B4" font-size="12">insert(Contribuinte) → boolean</text>
  <text x="271" y="142" fill="#1351B4" font-size="12">search(String cpf) → Contribuinte</text>
  <text x="271" y="160" fill="#1351B4" font-size="12">delete(String cpf) → boolean</text>

  <!-- implement lines -->
  <line x1="310" y1="168" x2="175" y2="230" stroke="#1351B4" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="450" y1="168" x2="585" y2="230" stroke="#1351B4" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- arrowheads (open triangle) -->
  <polygon points="175,230 165,216 185,216" fill="white" stroke="#1351B4" stroke-width="2"/>
  <polygon points="585,230 575,216 595,216" fill="white" stroke="#1351B4" stroke-width="2"/>

  <!-- BinarySearchTree box -->
  <rect x="60" y="230" width="230" height="80" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="60" y="230" width="230" height="40" rx="12" fill="#1351B4"/>
  <rect x="60" y="258" width="230" height="12" fill="#1351B4"/>
  <text x="175" y="255" text-anchor="middle" fill="white" font-size="14" font-weight="bold">BinarySearchTree</text>
  <text x="175" y="284" text-anchor="middle" fill="#555" font-size="11">+ searchPath, inOrder</text>
  <text x="175" y="300" text-anchor="middle" fill="#555" font-size="11">bstHeight, balanceFactor…</text>

  <!-- LinkedList box -->
  <rect x="470" y="230" width="230" height="80" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="470" y="230" width="230" height="40" rx="12" fill="#1351B4" opacity="0.7"/>
  <rect x="470" y="258" width="230" height="12" fill="#1351B4" opacity="0.7"/>
  <text x="585" y="255" text-anchor="middle" fill="white" font-size="14" font-weight="bold">LinkedList</text>
  <text x="585" y="284" text-anchor="middle" fill="#555" font-size="11">inserção O(1) no fim</text>
  <text x="585" y="300" text-anchor="middle" fill="#555" font-size="11">busca linear — O(n)</text>

  <!-- benefit annotation -->
  <rect x="100" y="328" width="560" height="6" rx="3" fill="#e8f0fe"/>
  <text x="380" y="322" text-anchor="middle" fill="#1351B4" font-size="12">mesmo código popula e opera as duas estruturas → viabiliza a aba Comparação</text>
</svg>

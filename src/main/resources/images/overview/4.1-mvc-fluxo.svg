<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="340" fill="#f8f9fa"/>
  <text x="430" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Arquitetura MVC — fluxo de dados</text>

  <!-- VIEW column -->
  <text x="130" y="70" text-anchor="middle" fill="#1351B4" font-size="13" font-weight="bold">VIEW</text>
  <rect x="30" y="82" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="130" y="108" text-anchor="middle" fill="#1351B4" font-size="13">OperationController</text>

  <rect x="30" y="144" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="130" y="170" text-anchor="middle" fill="#1351B4" font-size="13">DemoController</text>

  <rect x="30" y="206" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="2"/>
  <text x="130" y="232" text-anchor="middle" fill="#1351B4" font-size="13">CompareController</text>

  <!-- arrows to controller -->
  <line x1="230" y1="104" x2="310" y2="163" stroke="#1351B4" stroke-width="2"/>
  <line x1="230" y1="166" x2="310" y2="178" stroke="#1351B4" stroke-width="2"/>
  <line x1="230" y1="228" x2="310" y2="196" stroke="#1351B4" stroke-width="2"/>
  <polygon points="310,163 296,158 298,172" fill="#1351B4"/>
  <polygon points="310,178 296,173 298,187" fill="#1351B4"/>
  <polygon points="310,196 296,191 298,205" fill="#1351B4"/>

  <!-- CONTROLLER box -->
  <text x="430" y="70" text-anchor="middle" fill="#1351B4" font-size="13" font-weight="bold">CONTROLLER</text>
  <rect x="310" y="120" width="240" height="120" rx="12" fill="white" stroke="#F5A800" stroke-width="3"/>
  <rect x="310" y="120" width="240" height="40" rx="12" fill="#F5A800"/>
  <rect x="310" y="148" width="240" height="12" fill="#F5A800"/>
  <text x="430" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">ReceitaController</text>
  <text x="430" y="178" text-anchor="middle" fill="#555" font-size="11">validateCPF()</text>
  <text x="430" y="196" text-anchor="middle" fill="#555" font-size="11">registerCPF() / searchCPF()</text>
  <text x="430" y="214" text-anchor="middle" fill="#555" font-size="11">removeCPF() / listCPF()</text>
  <text x="430" y="232" text-anchor="middle" fill="#888" font-size="10">nenhuma view acessa a BST diretamente</text>

  <!-- arrows to model -->
  <line x1="550" y1="170" x2="630" y2="130" stroke="#1351B4" stroke-width="2"/>
  <line x1="550" y1="210" x2="630" y2="250" stroke="#1351B4" stroke-width="2"/>
  <polygon points="630,130 616,127 620,141" fill="#1351B4"/>
  <polygon points="630,250 616,243 620,257" fill="#1351B4"/>

  <!-- MODEL column -->
  <text x="730" y="70" text-anchor="middle" fill="#1351B4" font-size="13" font-weight="bold">MODEL</text>
  <rect x="630" y="82" width="200" height="70" rx="8" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="630" y="82" width="200" height="30" rx="8" fill="#1351B4"/>
  <rect x="630" y="100" width="200" height="12" fill="#1351B4"/>
  <text x="730" y="100" text-anchor="middle" fill="white" font-size="13" font-weight="bold">BinarySearchTree</text>
  <text x="730" y="128" text-anchor="middle" fill="#555" font-size="11">insert / search / delete</text>
  <text x="730" y="144" text-anchor="middle" fill="#555" font-size="11">inOrder / métricas</text>

  <rect x="630" y="202" width="200" height="60" rx="8" fill="white" stroke="#1351B4" stroke-width="2" opacity="0.7"/>
  <rect x="630" y="202" width="200" height="28" rx="8" fill="#1351B4" opacity="0.7"/>
  <rect x="630" y="218" width="200" height="12" fill="#1351B4" opacity="0.7"/>
  <text x="730" y="220" text-anchor="middle" fill="white" font-size="13">LinkedList</text>
  <text x="730" y="246" text-anchor="middle" fill="#888" font-size="11">busca linear — comparação</text>

  <!-- FXML/CSS label -->
  <rect x="30" y="270" width="200" height="36" rx="8" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="130" y="288" text-anchor="middle" fill="#1351B4" font-size="11">FXML + CSS externo</text>
  <text x="130" y="302" text-anchor="middle" fill="#888" font-size="10">layout e estilo desacoplados</text>
</svg>

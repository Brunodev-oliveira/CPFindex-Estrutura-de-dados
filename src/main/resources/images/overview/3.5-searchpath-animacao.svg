<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="320" fill="#f8f9fa"/>
  <text x="430" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">searchPath() — da lógica à animação</text>

  <!-- BST box -->
  <rect x="30" y="68" width="160" height="190" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="30" y="68" width="160" height="40" rx="12" fill="#1351B4"/>
  <rect x="30" y="96" width="160" height="12" fill="#1351B4"/>
  <text x="110" y="94" text-anchor="middle" fill="white" font-size="13" font-weight="bold">BinarySearchTree</text>
  <text x="110" y="128" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">searchPath(cpf)</text>
  <text x="110" y="150" text-anchor="middle" fill="#888" font-size="11">percorre a árvore</text>
  <text x="110" y="168" text-anchor="middle" fill="#888" font-size="11">acumula cada nó</text>
  <text x="110" y="186" text-anchor="middle" fill="#888" font-size="11">visitado em uma lista</text>
  <text x="110" y="206" text-anchor="middle" fill="#888" font-size="11">BST não sabe que</text>
  <text x="110" y="222" text-anchor="middle" fill="#888" font-size="11">será animada</text>

  <!-- arrow 1 -->
  <line x1="190" y1="163" x2="250" y2="163" stroke="#1351B4" stroke-width="2.5"/>
  <polygon points="250,163 237,156 237,170" fill="#1351B4"/>
  <text x="220" y="155" text-anchor="middle" fill="#1351B4" font-size="11">retorna</text>

  <!-- List box -->
  <rect x="250" y="90" width="180" height="146" rx="12" fill="white" stroke="#F5A800" stroke-width="2"/>
  <rect x="250" y="90" width="180" height="40" rx="12" fill="#F5A800"/>
  <rect x="250" y="118" width="180" height="12" fill="#F5A800"/>
  <text x="340" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="bold">List&lt;NodeBst&gt;</text>
  <text x="340" y="148" text-anchor="middle" fill="#555" font-size="12">[ raiz (448…)</text>
  <text x="340" y="168" text-anchor="middle" fill="#555" font-size="12">  nó 2 (782…)</text>
  <text x="340" y="188" text-anchor="middle" fill="#555" font-size="12">  nó 3 (458…)</text>
  <text x="340" y="208" text-anchor="middle" fill="#F5A800" font-size="12" font-weight="bold">  alvo (728…) ]</text>

  <!-- arrow 2 -->
  <line x1="430" y1="163" x2="490" y2="163" stroke="#1351B4" stroke-width="2.5"/>
  <polygon points="490,163 477,156 477,170" fill="#1351B4"/>
  <text x="460" y="155" text-anchor="middle" fill="#1351B4" font-size="11">mapeia</text>

  <!-- NodeBstVisual box -->
  <rect x="490" y="90" width="180" height="146" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="490" y="90" width="180" height="40" rx="12" fill="#1351B4"/>
  <rect x="490" y="118" width="180" height="12" fill="#1351B4"/>
  <text x="580" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="bold">NodeBstVisual</text>
  <text x="580" y="148" text-anchor="middle" fill="#555" font-size="11">espelho visual</text>
  <text x="580" y="166" text-anchor="middle" fill="#555" font-size="11">da árvore na tela</text>
  <text x="580" y="184" text-anchor="middle" fill="#555" font-size="11">cada nó lógico</text>
  <text x="580" y="202" text-anchor="middle" fill="#555" font-size="11">tem um visual</text>
  <text x="580" y="218" text-anchor="middle" fill="#555" font-size="11">correspondente</text>

  <!-- arrow 3 -->
  <line x1="670" y1="163" x2="730" y2="163" stroke="#F5A800" stroke-width="2.5"/>
  <polygon points="730,163 717,156 717,170" fill="#F5A800"/>
  <text x="700" y="155" text-anchor="middle" fill="#F5A800" font-size="11">anima</text>

  <!-- Animation box -->
  <rect x="730" y="90" width="110" height="146" rx="12" fill="white" stroke="#F5A800" stroke-width="2.5"/>
  <rect x="730" y="90" width="110" height="40" rx="12" fill="#F5A800"/>
  <rect x="730" y="118" width="110" height="12" fill="#F5A800"/>
  <text x="785" y="115" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Timeline</text>
  <text x="785" y="148" text-anchor="middle" fill="#555" font-size="11">destaca</text>
  <text x="785" y="166" text-anchor="middle" fill="#555" font-size="11">nó a nó</text>
  <text x="785" y="184" text-anchor="middle" fill="#555" font-size="11">com Fade</text>
  <text x="785" y="202" text-anchor="middle" fill="#555" font-size="11">Transition</text>

  <!-- key insight -->
  <rect x="30" y="278" width="800" height="32" rx="8" fill="#e8f0fe"/>
  <text x="430" y="298" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">BST permanece agnóstica à interface — não sabe que está sendo animada</text>
</svg>

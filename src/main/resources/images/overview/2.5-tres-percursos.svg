<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#f8f9fa"/>
  <text x="450" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Percursos da Árvore</text>

  <!-- shared tree (top center) -->
  <g transform="translate(350,50)">
    <rect x="60" y="10" width="60" height="28" rx="6" fill="#1351B4"/>
    <text x="90" y="28" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>

    <rect x="10" y="68" width="50" height="28" rx="6" fill="#1351B4" opacity="0.8"/>
    <text x="35" y="86" text-anchor="middle" fill="white" font-size="14">2</text>

    <rect x="120" y="68" width="50" height="28" rx="6" fill="#1351B4" opacity="0.8"/>
    <text x="145" y="86" text-anchor="middle" fill="white" font-size="14">6</text>

    <rect x="-10" y="126" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
    <text x="13" y="144" text-anchor="middle" fill="#1351B4" font-size="14">1</text>

    <rect x="44" y="126" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
    <text x="67" y="144" text-anchor="middle" fill="#1351B4" font-size="14">3</text>

    <rect x="104" y="126" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
    <text x="127" y="144" text-anchor="middle" fill="#1351B4" font-size="14">5</text>

    <rect x="158" y="126" width="46" height="28" rx="6" fill="#e8f0fe" stroke="#1351B4" stroke-width="1.5"/>
    <text x="181" y="144" text-anchor="middle" fill="#1351B4" font-size="14">7</text>

    <line x1="90" y1="38" x2="35" y2="68" stroke="#1351B4" stroke-width="1.5"/>
    <line x1="90" y1="38" x2="145" y2="68" stroke="#1351B4" stroke-width="1.5"/>
    <line x1="35" y1="96" x2="13" y2="126" stroke="#1351B4" stroke-width="1.5"/>
    <line x1="35" y1="96" x2="67" y2="126" stroke="#1351B4" stroke-width="1.5"/>
    <line x1="145" y1="96" x2="127" y2="126" stroke="#1351B4" stroke-width="1.5"/>
    <line x1="145" y1="96" x2="181" y2="126" stroke="#1351B4" stroke-width="1.5"/>
  </g>

  <!-- PRE-ORDER panel -->
  <rect x="20" y="260" width="260" height="175" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="20" y="260" width="260" height="40" rx="12" fill="#1351B4"/>
  <rect x="20" y="284" width="260" height="16" fill="#1351B4"/>
  <text x="150" y="285" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Pre-Order</text>
  <text x="150" y="312" text-anchor="middle" fill="#555" font-size="12">Raiz → Esquerda → Direita</text>
  <text x="150" y="334" text-anchor="middle" fill="#1351B4" font-size="15" font-weight="bold">4, 2, 1, 3, 6, 5, 7</text>
  <text x="150" y="360" text-anchor="middle" fill="#888" font-size="11">raiz aparece primeiro</text>
  <text x="150" y="380" text-anchor="middle" fill="#888" font-size="11">útil para serializar / copiar</text>
  <text x="150" y="402" text-anchor="middle" fill="#888" font-size="11">a estrutura da árvore</text>
  <rect x="40" y="416" width="220" height="8" rx="4" fill="#e8f0fe"/>

  <!-- IN-ORDER panel (highlighted) -->
  <rect x="320" y="260" width="260" height="175" rx="12" fill="white" stroke="#F5A800" stroke-width="3"/>
  <rect x="320" y="260" width="260" height="40" rx="12" fill="#F5A800"/>
  <rect x="320" y="284" width="260" height="16" fill="#F5A800"/>
  <text x="450" y="285" text-anchor="middle" fill="white" font-size="13" font-weight="bold">★ In-Order — CPFindex</text>
  <text x="450" y="312" text-anchor="middle" fill="#555" font-size="12">Esquerda → Raiz → Direita</text>
  <text x="450" y="334" text-anchor="middle" fill="#1351B4" font-size="15" font-weight="bold">1, 2, 3, 4, 5, 6, 7</text>
  <text x="450" y="360" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">sempre crescente em BST</text>
  <text x="450" y="380" text-anchor="middle" fill="#555" font-size="11">usado no painel lateral</text>
  <text x="450" y="402" text-anchor="middle" fill="#555" font-size="11">do CPFindex</text>
  <rect x="340" y="416" width="220" height="8" rx="4" fill="#F5A800"/>

  <!-- POST-ORDER panel -->
  <rect x="620" y="260" width="260" height="175" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
  <rect x="620" y="260" width="260" height="40" rx="12" fill="#1351B4"/>
  <rect x="620" y="284" width="260" height="16" fill="#1351B4"/>
  <text x="750" y="285" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Post-Order</text>
  <text x="750" y="312" text-anchor="middle" fill="#555" font-size="12">Esquerda → Direita → Raiz</text>
  <text x="750" y="334" text-anchor="middle" fill="#1351B4" font-size="15" font-weight="bold">1, 3, 2, 5, 7, 6, 4</text>
  <text x="750" y="360" text-anchor="middle" fill="#888" font-size="11">raiz aparece por último</text>
  <text x="750" y="380" text-anchor="middle" fill="#888" font-size="11">útil para deletar a árvore</text>
  <text x="750" y="402" text-anchor="middle" fill="#888" font-size="11">sem perder referências</text>
  <rect x="640" y="416" width="220" height="8" rx="4" fill="#e8f0fe"/>
</svg>

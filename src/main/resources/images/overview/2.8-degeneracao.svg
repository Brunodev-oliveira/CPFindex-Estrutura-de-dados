  <line x1="50" y1="128" x2="50" y2="278" stroke="#1351B4" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="44" y1="128" x2="56" y2="128" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="44" y1="278" x2="56" y2="278" stroke="#1351B4" stroke-width="1.5"/>
  <text x="38" y="210" fill="#1351B4" font-size="11" text-anchor="middle" transform="rotate(-90,38,210)">altura = 3</text>

  <rect x="80" y="310" width="260" height="28" rx="6" fill="#e8f0fe"/>
  <text x="210" y="328" text-anchor="middle" fill="#1351B4" font-size="12" font-weight="bold">busca: ~3 comparações para 7 nós</text>

  <!-- VS -->
  <circle cx="430" cy="240" r="24" fill="#1351B4" stroke="white" stroke-width="2"/>
  <text x="430" y="246" text-anchor="middle" fill="white" font-size="14" font-weight="bold">VS</text>

  <!-- RIGHT: degenerate -->
  <rect x="460" y="55" width="380" height="350" rx="12" fill="white" stroke="#e63946" stroke-width="2"/>
  <rect x="460" y="55" width="380" height="44" rx="12" fill="#e63946"/>
  <rect x="460" y="83" width="380" height="16" fill="#e63946"/>

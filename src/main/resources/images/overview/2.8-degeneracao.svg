  <text x="210" y="116" text-anchor="middle" fill="#555" font-size="11">inserção: 4, 2, 6, 1, 3, 5, 7</text>

  <rect x="180" y="128" width="60" height="30" rx="6" fill="#1351B4"/>
  <text x="210" y="147" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>


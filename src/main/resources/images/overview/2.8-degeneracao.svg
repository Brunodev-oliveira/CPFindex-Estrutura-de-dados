  <rect x="500" y="128" width="50" height="30" rx="6" fill="#e63946" opacity="0.9"/>
  <text x="525" y="147" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>
  <line x1="525" y1="158" x2="565" y2="182" stroke="#e63946" stroke-width="1.5"/>

  <rect x="540" y="182" width="50" height="30" rx="6" fill="#e63946" opacity="0.8"/>
  <text x="565" y="201" text-anchor="middle" fill="white" font-size="14">2</text>
  <line x1="565" y1="212" x2="605" y2="236" stroke="#e63946" stroke-width="1.5"/>

  <rect x="580" y="236" width="50" height="30" rx="6" fill="#e63946" opacity="0.7"/>
  <text x="605" y="255" text-anchor="middle" fill="white" font-size="14">3</text>
  <line x1="605" y1="266" x2="645" y2="290" stroke="#e63946" stroke-width="1.5"/>

  <rect x="620" y="290" width="50" height="30" rx="6" fill="#e63946" opacity="0.6"/>
  <text x="645" y="309" text-anchor="middle" fill="white" font-size="14">4</text>
  <line x1="645" y1="320" x2="685" y2="340" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4"/>

  <text x="700" y="360" fill="#e63946" font-size="22">⋱</text>

  <!-- bracket annotation -->
  <line x1="790" y1="128" x2="790" y2="360" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="812" y="250" fill="#e63946" font-size="11" text-anchor="middle" transform="rotate(90,812,250)">altura = n</text>

  <rect x="480" y="310" width="340" height="28" rx="6" fill="#fde8e8"/>
  <text x="650" y="328" text-anchor="middle" fill="#e63946" font-size="12" font-weight="bold">busca: até 7 comparações — vira lista ligada</text>
</svg>

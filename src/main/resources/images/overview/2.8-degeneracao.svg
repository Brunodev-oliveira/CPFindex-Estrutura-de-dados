  <line x1="210" y1="158" x2="128" y2="188" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="210" y1="158" x2="292" y2="188" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="128" y1="218" x2="81" y2="248" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="128" y1="218" x2="173" y2="248" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="292" y1="218" x2="269" y2="248" stroke="#1351B4" stroke-width="1.5"/>
  <line x1="292" y1="218" x2="361" y2="248" stroke="#1351B4" stroke-width="1.5"/>


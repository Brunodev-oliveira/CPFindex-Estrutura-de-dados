<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="420" fill="#f8f9fa"/>
  <text x="430" y="34" text-anchor="middle" fill="#1351B4" font-size="18" font-weight="bold">Degeneração — quando O(log n) vira O(n)</text>

  <!-- LEFT: balanced -->
  <rect x="20" y="55" width="380" height="350" rx="12" fill="white" stroke="#1351B4" stroke-width="2"/>
